name: Release package

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  package:
    name: Build plugin release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring

      - name: Build plugin package
        run: |
          PACKAGE_NAME="Herzenssache-UltimateMember-Extension"
          OUTPUT_FILE="${PACKAGE_NAME}.zip"
          
          # Create a temporary directory for the clean package
          TEMP_DIR=$(mktemp -d)
          PACKAGE_DIR="$TEMP_DIR/$PACKAGE_NAME"
          
          # Copy only the files we want in the package (excluding dev files)
          mkdir -p "$PACKAGE_DIR"
          cp herzenssache-ultimate-member.php "$PACKAGE_DIR/"
          cp -r src "$PACKAGE_DIR/" 2>/dev/null || true
          cp composer.json "$PACKAGE_DIR/" 2>/dev/null || true
          
          # Create the zip file
          cd "$TEMP_DIR"
          zip -r "$OUTPUT_FILE" "$PACKAGE_NAME"
          mv "$OUTPUT_FILE" "$GITHUB_WORKSPACE/"
          
          # Cleanup
          rm -rf "$TEMP_DIR"
          
          ls -lh "$GITHUB_WORKSPACE/$OUTPUT_FILE"

      - name: Upload package artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Herzenssache-UltimateMember-Extension-package
          path: Herzenssache-UltimateMember-Extension.zip

      - name: Upload package to GitHub release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} Herzenssache-UltimateMember-Extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
